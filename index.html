<style>
/* Layout: Produkt-App mit App-Leiste; Hauptablauf in einer schmalen Spalte. Gratis-Teil plus gesperrte Toolkit-Teaser. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#13232B; --muted:#5A6A72; --line:#DAE2E5;
  --primary:#0E5A6B; --on-primary:#FFFFFF; --primary-soft:#E1EEF1; --accent:#E2762A; --accent-soft:#FBEADD;
  --ok:#2F7D4F; --warn:#A86A12; --crit:#B23A2C;
  --shadow:0 1px 2px rgba(19,35,43,.06),0 4px 14px rgba(19,35,43,.05);
  --f-head:"Red Hat Display",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161A; --surface:#14222A; --ink:#E2EBEE; --muted:#94A7AF; --line:#25373F;
  --primary:#5EB2C3; --on-primary:#0D161A; --primary-soft:#173139; --accent:#F0924C; --accent-soft:#3A2618;
  --ok:#6FBE8C; --warn:#E3A452; --crit:#EE7B69; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161A; --surface:#14222A; --ink:#E2EBEE; --muted:#94A7AF; --line:#25373F;
  --primary:#5EB2C3; --on-primary:#0D161A; --primary-soft:#173139; --accent:#F0924C; --accent-soft:#3A2618;
  --ok:#6FBE8C; --warn:#E3A452; --crit:#EE7B69; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.muted{color:var(--muted)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* App-Leiste */
.appbar{background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer}
.logo svg{width:31px;height:26px;flex:none}
.logo strong{font-family:var(--f-head);font-weight:800;font-size:20px;letter-spacing:-.015em}
.logo .dash{color:var(--accent)}
.logo strong{white-space:nowrap}
.logo em{font-style:normal;font-weight:500;color:var(--muted);font-size:15px}
.sec{display:flex;gap:4px;align-items:center}
.sec button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:15px;color:var(--muted)}
.sec button:hover{background:var(--bg);color:var(--ink)}
.sec button.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.sec button.tk{color:var(--accent);font-weight:700}
.sec button.tk.on{background:var(--accent-soft);color:var(--accent)}

.page{padding-block:28px 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:1080px}
main{display:flex;flex-direction:column;gap:24px}

/* Schritte */
.stepper{display:flex;gap:8px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{flex:1 1 0;min-width:0}
.stepper button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;cursor:pointer;font-weight:500;font-size:14.5px;color:var(--muted);text-align:left}
.stepper .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:13px;flex:none;background:var(--surface)}
.stepper button.now{color:var(--ink);font-weight:700}
.stepper button.now .dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.stepper button.done{color:var(--ink)}
.stepper button.done .dot{border-color:var(--primary);color:var(--primary)}
.stepper button:disabled{cursor:default;opacity:.55}

.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.btn.buy{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.buy:hover{filter:brightness(1.06)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.link{border:0;padding:0;background:none;color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;filter:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.head{display:flex;flex-direction:column;gap:8px}
.head h1{font-size:clamp(28px,4.6vw,38px);font-weight:800;letter-spacing:-.015em}
.kicker{font-size:14px;font-weight:700;color:var(--primary)}
.kicker.tk{color:var(--accent)}
.lock{width:16px;height:16px;flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.free{background:var(--primary-soft);color:var(--primary)}
.pill.pro{background:var(--accent-soft);color:var(--accent)}

/* Start */
.hero{display:flex;flex-direction:column;gap:20px}
.hero h1{font-size:clamp(34px,6.4vw,52px);font-weight:800;letter-spacing:-.02em}
.hero .lead{font-size:18.5px;color:var(--muted);max-width:50ch}
.field{display:flex;flex-direction:column;gap:6px;max-width:380px}
.field label{font-weight:700;font-size:14px}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.input:focus{border-color:var(--primary);outline:none}
.howto{list-style:none;margin:6px 0 0;padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.howto li{display:flex;flex-direction:column;gap:4px;min-width:0}
.howto .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px}
.howto b{font-family:var(--f-head);font-size:18px}
.howto span:last-child{font-size:14.5px;color:var(--muted)}

/* Frage */
.q{display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.qmeta b{color:var(--primary)}
.qbar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.qbar button{height:6px;border:0;border-radius:3px;background:var(--line);cursor:pointer;padding:0}
.qbar button.a{background:var(--primary)}
.qbar button.c{background:var(--accent)}
.q h2{font-size:clamp(26px,4.4vw,34px);font-weight:800;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 16px;cursor:pointer;font-size:16px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--primary)}
.opt .n{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .n{background:var(--primary);color:var(--on-primary)}
.qnav{display:flex;justify-content:space-between;gap:10px}

/* Ergebnis */
.score{padding:22px;display:flex;flex-direction:column;gap:18px}
.score-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.big{font-family:var(--f-head);font-weight:800;font-size:72px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:6px}
.track{position:relative;padding-top:14px}
.track-segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.track-segs div{display:flex;flex-direction:column;gap:6px;min-width:0}
.track-segs i{height:12px;border-radius:6px;background:var(--line)}
.track-segs i.f{background:var(--primary)}
.track-segs i.cur{background:var(--accent)}
.track-segs span{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.track-segs b{font-size:12.5px;text-align:center}
.marker{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink);transform:translateX(-50%)}
.fields{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.frow-name{font-weight:700}
.frow-st{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.fseg{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fseg i{height:8px;border-radius:4px;background:var(--line)}
.info{position:relative;width:22px;height:22px;padding:0;margin-left:7px;vertical-align:2px;display:inline-grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--primary) 55%,var(--line));border-radius:50%;background:var(--surface);color:var(--primary);font:700 13px/1 var(--f-body);cursor:pointer}
.info::before{content:'';position:absolute;inset:-8px}
.info:hover,.info[aria-expanded="true"]{border-color:var(--primary);background:var(--primary-soft)}
.finfo{grid-column:1/-1;margin:0;font-size:14.5px;line-height:1.45;color:var(--muted);max-width:60ch}
.q .finfo{margin-top:-6px}
@media (max-width:480px){.frow{grid-template-columns:1fr;gap:4px}}
.fseg i.f{background:var(--primary)}
.fseg i.weak{background:var(--accent)}
.msg{border-left:4px solid var(--accent);background:var(--surface);padding:14px 16px;border-radius:0 10px 10px 0}
.msg b{display:block;margin-bottom:2px}
.tag{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14.5px;background:var(--primary-soft);border-radius:8px;padding:10px 14px}
.share{padding:20px;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center}
.share img{width:100%;height:auto;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:block;background:var(--bg)}
.share-txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.share-txt h2{font-size:21px;font-weight:800}
.share-txt small{font-size:13px}
.share .chk{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.share .chk input{accent-color:var(--primary);width:17px;height:17px}
@media (max-width:560px){.share{grid-template-columns:1fr}.share img{max-width:300px}}

/* Massnahmen */
.mcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;gap:14px;align-items:flex-start}
.mnum{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:800}
.mnum.o{background:var(--bg);color:var(--muted)}
.mhead{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.mhead small{font-size:13.5px;color:var(--muted)}
.mhead h2{font-size:21px;font-weight:800}
.goal{font-size:15px;color:var(--muted)}
.goal b{color:var(--ink);font-weight:500}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cl label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:15.5px}
.cl label:hover{background:var(--bg)}
.cl input{margin-top:4px;accent-color:var(--primary);width:17px;height:17px;flex:none}
.cl input:checked + span{text-decoration:line-through;color:var(--muted)}
.lockline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14.5px}
.lockline .lock{color:var(--accent)}
.lockline span{flex:1 1 220px;min-width:0}
.mfoot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
details.more > summary{cursor:pointer;font-weight:700;padding:6px 0}
.minor{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.promo{padding:22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px 24px;border:1.5px solid var(--accent)}
.promo > div:first-child{display:flex;flex-direction:column;gap:4px;max-width:46ch;min-width:0}
.promo h2{font-size:22px;font-weight:800}

/* Werkzeuge */
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--primary)}
.pick[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.pick .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick small{font-size:13px;color:var(--muted)}
.pick b{font-family:var(--f-head);font-size:18px}
.pick span.d{font-size:14px;color:var(--muted)}
.tool{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tool h2{font-size:24px;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;min-width:0}
.form .full{grid-column:1/-1}
.out{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:14px}
.out output{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all}
.legend{font-size:13.5px;color:var(--muted)}
.toast{font-size:14px;color:var(--ok);font-weight:500;min-height:1.2em}
.teaser{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:260px}
.teaser .blur{filter:blur(3px);opacity:.55;pointer-events:none;user-select:none;padding:14px}
.teaser .over{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.teaser .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.teaser .box h3{font-size:19px;font-weight:800}
.fake{width:100%;border-collapse:collapse;font-size:13px}
.fake td,.fake th{border-bottom:1px solid var(--line);padding:8px;text-align:center}
.fake td:first-child,.fake th:first-child{text-align:left}
.fake .A{background:var(--primary);color:var(--on-primary);border-radius:4px;padding:2px 8px;font-weight:700}
.fakeform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fakeform div{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700}
.fakeform i{display:block;height:34px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}

/* Toolkit */
.tk-hero{padding:24px;display:flex;flex-direction:column;gap:16px;border:1.5px solid var(--accent)}
.tk-price{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.tk-price b{font-family:var(--f-head);font-weight:800;font-size:34px}
.tk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.tk-list li{display:flex;gap:12px;align-items:flex-start}
.tk-list .ic{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px}
.tk-list b{display:block}
.tk-list span{color:var(--muted);font-size:15px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .card{padding:18px;display:flex;flex-direction:column;gap:10px}
.compare h3{font-size:18px;font-weight:800}
.compare ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}

/* Verlauf */
.chartbox{padding:14px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .ln{stroke:var(--primary);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--surface);stroke:var(--primary);stroke-width:2.5}
.chart .pt.last{fill:var(--accent);stroke:var(--accent)}
.tablebox{overflow-x:auto}
.htable{border-collapse:collapse;width:100%;font-size:14px}
.htable th,.htable td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.htable th{font-size:13px;color:var(--muted);font-weight:700}
.htable th:nth-child(-n+2),.htable td:nth-child(-n+2){text-align:left}
.htable tbody tr:last-child td{border-bottom:0}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--crit);background:var(--bg)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted);text-align:center}
.legal{padding:22px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
.legal h2{font-size:20px;font-weight:800;margin-top:6px}

footer{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}

@media (max-width:860px){ .picker{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  .howto{grid-template-columns:1fr}
  .form,.fakeform,.compare{grid-template-columns:1fr}
  .logo em{display:none}
  .sec button{padding:7px 8px;font-size:14px}
  .stepper button{font-size:13px;gap:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Bewertung ---------- */
const stageAvg = a => a < 1.8 ? 1 : a < 2.65 ? 2 : a < 3.5 ? 3 : a < 4.35 ? 4 : 5;
const stageTotal = s => s <= 12 ? 1 : s <= 18 ? 2 : s <= 24 ? 3 : s <= 30 ? 4 : 5;
const NEXT = {1:13, 2:19, 3:25, 4:31};
const RANGES = ['7–12','13–18','19–24','25–30','31–35'];
function score(){
  const v = state.values, fields = {};
  for(const fk in FIELDS){
    const inds = INDICATORS.filter(i => i.field === fk);
    const sum = inds.reduce((a,i) => a + (v[i.id]||0), 0);
    fields[fk] = {sum, max:inds.length*5, stage: inds.every(i => v[i.id]) ? stageAvg(sum/inds.length) : null};
  }
  const answered = INDICATORS.filter(i => v[i.id]).length;
  const total = INDICATORS.reduce((a,i) => a + (v[i.id]||0), 0);
  const complete = answered === INDICATORS.length;
  return {fields, total, answered, complete, stage: complete ? stageTotal(total) : null};
}

      <div class="share-txt">

        <p class="muted">Zeigen Sie Ihr Ergebnis im Team oder bei Berufskollegen – und finden Sie heraus, wo andere Betriebe stehen.</p>

const SHARE_URL = 'https://www.baustelle-buero.ch/?utm_source=teilen&utm_medium=ergebnis';
const withName = () => { const c = $('#share-name'); return !!(c && c.checked && state.betrieb.trim()); };
function shareText(named){
  const r = score(), who = named ? state.betrieb.trim() : 'Unser Betrieb';
  return `${who} hat im Büro-Check von baustelle-büro Reifegrad ${r.stage} von 5 erreicht (${r.total} von 35 Punkten). Wo steht dein Betrieb? Gratis-Check in wenigen Minuten: ${SHARE_URL}`;

const shareWa = named => 'https://wa.me/?text=' + encodeURIComponent(shareText(named));
let shareBlob = null, shareUrl = '';
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
async function drawShare(named){
  const r = score(), S = 1080, P = 90;
  const C = {bg:'#F2F5F6', card:'#FFFFFF', ink:'#13232B', muted:'#5A6A72', line:'#DAE2E5', primary:'#0E5A6B', accent:'#E2762A'};
  const D = '"Red Hat Display",system-ui,sans-serif', T = '"Red Hat Text",system-ui,sans-serif';
  try{ await Promise.all(['600 32px','700 44px','800 60px'].map(f => document.fonts.load(`${f} "Red Hat Display"`)).concat(document.fonts.load('500 32px "Red Hat Text"'))); }catch(e){}
  const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  const c = cv.getContext('2d');
  c.fillStyle = C.bg; c.fillRect(0,0,S,S);
  c.fillStyle = C.card; rr(c, 40, 40, S-80, S-80, 36); c.fill();
  // Logo
  [[0,19.6,8.4],[7.2,15.4,12.6],[14.4,11.2,16.8],[21.6,6.2,21.8],[28.8,0,28]].forEach(([x,y,h],i) => {
    c.fillStyle = i===4 ? C.accent : C.primary; rr(c, P + x*3, P + y*3, 13.8, h*3, 6.9); c.fill(); });
  c.textBaseline = 'alphabetic'; c.font = `800 54px ${D}`;
  let x = P + 130; const wy = P + 74;
  [['baustelle',C.ink],['-',C.accent],['büro',C.ink]].forEach(([s,col]) => { c.fillStyle = col; c.fillText(s, x, wy); x += c.measureText(s).width; });
  // Kopf
  let y = 330;
  c.fillStyle = C.primary; c.font = `600 34px ${D}`; c.fillText('Büro-Check für Handwerksbetriebe', P, y);
  if(named){
    y += 62; c.fillStyle = C.ink; c.font = `700 44px ${D}`;
    let n = state.betrieb.trim(); while(c.measureText(n).width > S-2*P && n.length > 4) n = n.slice(0,-2).trimEnd() + '…';
    c.fillText(n, P, y);
  }
  // Reifegrad
  y += 80; c.fillStyle = C.muted; c.font = `700 44px ${D}`; c.fillText('Reifegrad', P, y);
  y += named ? 190 : 230; c.fillStyle = C.ink; c.font = `800 ${named ? 210 : 250}px ${D}`; c.fillText(String(r.stage), P - 6, y);
  const sw = c.measureText(String(r.stage)).width;
  c.fillStyle = C.muted; c.font = `700 64px ${D}`; c.fillText('von 5', P + sw + 18, y);
  // Stufenbalken
  y += 56; const gap = 16, bw = (S - 2*P - 4*gap) / 5;
  for(let i=1;i<=5;i++){ c.fillStyle = i===r.stage ? C.accent : i<r.stage ? C.primary : C.line; rr(c, P + (i-1)*(bw+gap), y, bw, 26, 13); c.fill(); }
  y += 82; c.fillStyle = C.ink; c.font = `500 34px ${T}`; c.fillText(`${r.total} von 35 Punkten`, P, y);
  // Fuss
  c.fillStyle = C.line; c.fillRect(P, 860, S-2*P, 2);
  c.fillStyle = C.ink; c.font = `800 48px ${D}`; c.fillText('Wo steht dein Betrieb?', P, 940);
  c.fillStyle = C.primary; c.font = `500 34px ${T}`; c.fillText('Gratis-Check auf baustelle-buero.ch', P, 992);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
async function updateShare(){
  const img = $('#share-img'); if(!img) return;
  const named = withName();
  const blob = await drawShare(named);
  if(!blob || !$('#share-img')) return;
  if(shareUrl) URL.revokeObjectURL(shareUrl);
  shareBlob = blob; shareUrl = URL.createObjectURL(blob); $('#share-img').src = shareUrl;
  $('#share-wa').href = shareWa(named);
  const btn = $('#share-go'); if(btn) btn.hidden = !navigator.share;

const shareFile = () => new File([shareBlob], 'baustelle-buero-ergebnis.png', {type:'image/png'});
function shareToast(m){ const el = $('#share-toast'); if(!el) return; el.textContent = m; setTimeout(() => { if(el.textContent===m) el.textContent=''; }, 3200); }
async function shareNative(){
  if(!shareBlob) return;
  const text = shareText(withName());
  try{
    const f = shareFile();
    if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], text, title:'Mein Ergebnis im Büro-Check'});
    else await navigator.share({text, title:'Mein Ergebnis im Büro-Check'});
  }catch(e){ if(e && e.name !== 'AbortError') shareToast('Teilen hat nicht geklappt. Bild speichern und Text kopieren.'); }
}
function shareDownload(){
  if(!shareBlob) return;
  const a = document.createElement('a'); a.href = shareUrl; a.download = 'baustelle-buero-ergebnis.png';
  document.body.appendChild(a); a.click(); a.remove();
  shareToast('Bild gespeichert. Mit «Text kopieren» haben Sie den passenden Beitragstext.');
}
function shareCopy(){
  const text = shareText(withName());
  try{ navigator.clipboard.writeText(text).then(() => shareToast('Text kopiert.'), () => shareToast('Kopieren nicht möglich.')); }catch(e){ shareToast('Kopieren nicht möglich.'); }

V.verlauf = () => {
  const H = state.history;
  const head = `<div class="head"><span class="kicker">Verlauf</span><h1>Entwicklung über die Zeit</h1><p class="muted">Machen Sie die Einschätzung alle drei Monate und speichern Sie das Ergebnis. Der Verlauf bleibt nur in diesem Browser.</p></div>`;
  if(!H.length) return `${head}<div class="empty">Noch kein Ergebnis gespeichert. Nach der Einschätzung im Ergebnis «Im Verlauf speichern» wählen.</div>`;
  const W=600, Ht=220, L=34, Rr=58, T=16, B=30, y = s => T + (35-s)/28*(Ht-T-B);
  const x = i => H.length===1 ? (L+W-Rr)/2 : L + i/(H.length-1)*(W-L-Rr);
  const fd = iso => new Date(iso).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'2-digit'});
  let g = '';
  [12.5,18.5,24.5,30.5].forEach(b => g += `<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(b)}" y2="${y(b)}" stroke-dasharray="3 4"/>`);
  [[7,12.5],[12.5,18.5],[18.5,24.5],[24.5,30.5],[30.5,35]].forEach((r,i) => g += `<text class="lbl" x="${W-Rr+8}" y="${(y(r[0])+y(r[1]))/2+4}">Stufe ${i+1}</text>`);
  g += `<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(7)}" y2="${y(7)}"/>`;
  if(H.length>1) g += `<polyline class="ln" points="${H.map((e,i) => `${x(i)},${y(e.total)}`).join(' ')}"/>`;
  H.forEach((e,i) => { g += `<circle class="pt${i===H.length-1?' last':''}" cx="${x(i)}" cy="${y(e.total)}" r="5"/><text class="lbl" x="${x(i)}" y="${y(e.total)-11}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${e.total}</text><text class="lbl" x="${x(i)}" y="${Ht-8}" text-anchor="middle">${fd(e.date)}</text>`; });
  const rows = H.map((e,i) => `<tr><td>${fd(e.date)}</td><td>${esc(e.betrieb||'–')}</td><td>${e.total}</td><td>${e.stage}</td><td><button class="x" data-delhist="${i}" aria-label="Eintrag löschen">×</button></td></tr>`).reverse().join('');
  return `${head}
    <div class="card chartbox"><svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Gesamtscore über die Zeit">${g}</svg></div>
    <div class="card tablebox"><table class="htable"><thead><tr><th>Datum</th><th>Betrieb</th><th>Punkte</th><th>Reifegrad</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
};

/* ---------- Navigation ---------- */
const VIEWS = ['start','fragen','ergebnis','massnahmen','werkzeuge','verlauf','toolkit','impressum','datenschutz','agb'];
function go(v, mode){
  mode = mode || 'push';
  const r = score();
  if((v==='ergebnis' || v==='massnahmen') && !r.complete){ v = 'fragen'; qi = Math.max(0, INDICATORS.findIndex(i => !state.values[i.id])); }
  if(!VIEWS.includes(v)) v = 'start';
  if(v==='ergebnis' && view==='fragen' && !state.example) track('check-abgeschlossen');
  view = v;
  $('#wrap').classList.toggle('wide', v==='werkzeuge');
  $('#main').innerHTML = V[v]();
  const flow = ['fragen','ergebnis','massnahmen'];
  $('#stepper').hidden = !flow.includes(v);
  flow.forEach((k,i) => { const b = $('#st-'+k); b.className = k===v ? 'now' : (flow.indexOf(v) > i ? 'done' : ''); b.disabled = k!=='fragen' && !r.complete; });
  ['werkzeuge','verlauf','toolkit'].forEach(k => $('#nav-'+k).classList.toggle('on', v===k));
  if(v==='werkzeuge' && state.tool==='fname') initFname();
  if(v==='ergebnis' && !state.example) updateShare();
  try{
    const st = {v:v, qi:qi}, cur = history.state;
    const same = cur && cur.v === v && (v !== 'fragen' || cur.qi === qi);
    if(mode === 'replace' || (mode === 'push' && same)) history.replaceState(st,'','#'+v);
    else if(mode === 'push') history.pushState(st,'','#'+v);
  }catch(e){}
  window.scrollTo(0,0);
}
window.addEventListener('popstate', e => {
  clearTimeout(advanceT);
  const st = e.state;
  if(st && st.v){ if(typeof st.qi === 'number') qi = st.qi; go(st.v, 'none'); }
  else go((location.hash||'').slice(1) || 'start', 'replace');
});

let advanceT;
document.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('[data-view]');
  if(nav && !nav.disabled){
    e.preventDefault();
    if(nav.dataset.tool){ state.tool = nav.dataset.tool; save(); }
    if(nav.dataset.view==='fragen' && view!=='fragen') qi = 0;
    return go(nav.dataset.view);
  }
  if(t.closest('#go-start')){
    if(state.example){ state.values = {}; state.example = false; }
    if(score().complete) return go('ergebnis');
    qi = Math.max(0, INDICATORS.findIndex(i => !state.values[i.id])); save(); return go('fragen');
  }
  if(t.closest('#go-example')){ track('beispiel-angesehen'); state.values = {...EXAMPLE_VALUES}; state.example = true; save(); return go('ergebnis'); }
  if(t.closest('#go-new') || t.closest('#own')){ state.values = {}; state.example = false; state.checks = {}; qi = 0; save(); return go(t.closest('#own') ? 'start' : 'fragen'); }
  const inf = t.closest('[data-info]');
  if(inf){ const el = document.getElementById(inf.getAttribute('aria-controls')); const open = inf.getAttribute('aria-expanded') !== 'true';
    inf.setAttribute('aria-expanded', open); if(el) el.hidden = !open; return; }
  const pick = t.closest('[data-pick]');
  if(pick){
    state.values[INDICATORS[qi].id] = +pick.dataset.pick; state.example = false; save();
    document.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o===pick));
    $('#q-next').disabled = false;
    clearTimeout(advanceT);
    advanceT = setTimeout(() => { if(qi < INDICATORS.length-1){ qi++; go('fragen'); } else go('ergebnis'); }, 280);
    return;
  }
  const dot = t.closest('[data-q]'); if(dot){ clearTimeout(advanceT); qi = +dot.dataset.q; return go('fragen'); }
  if(t.closest('#q-back')){ clearTimeout(advanceT); qi = Math.max(0, qi-1); return go('fragen'); }
  if(t.closest('#q-next')){ clearTimeout(advanceT); if(qi < INDICATORS.length-1){ qi++; go('fragen'); } else go('ergebnis'); return; }
  if(t.closest('#save-hist')){
    const r = score(); state.history.push({date:new Date().toISOString(), betrieb:state.betrieb, total:r.total, stage:r.stage}); save();
    $('#toast').textContent = 'Im Verlauf gespeichert.'; return;
  }
  const dh = t.closest('[data-delhist]'); if(dh){ state.history.splice(+dh.dataset.delhist,1); save(); return go('verlauf'); }
  const pt = t.closest('[data-pick-tool]');
  if(pt){ state.tool = pt.dataset.pickTool; save();
    document.querySelectorAll('[data-pick-tool]').forEach(b => b.setAttribute('aria-pressed', b===pt));
    $('#tool-panel').innerHTML = TOOL_HTML[state.tool](); if(state.tool==='fname') initFname(); return; }
  if(t.closest('#fn-copy')) copyName();
  if(t.closest('#share-go')){ track('teilen-nativ'); return shareNative(); }
  if(t.closest('#share-wa')) track('teilen-whatsapp');
  if(t.closest('#share-dl')){ track('teilen-bild'); return shareDownload(); }
  if(t.closest('#share-copy')){ track('teilen-text'); return shareCopy(); }
  if(t.closest('.btn.buy')) track('toolkit-kauf-klick');
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'betrieb'){ state.betrieb = t.value; save(); }
  if(t.id && t.id.startsWith('fn-')) renderFname();
});
document.addEventListener('change', e => {
  if(e.target.id === 'share-name') return updateShare();
  const id = e.target.dataset && e.target.dataset.check; if(!id) return;
  state.checks[id] = e.target.checked; save();
});

/* ---------- Dateinamen ---------- */
function slug(s){
  return s.trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-').replace(/[^A-Za-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function fileName(){
  const d = $('#fn-date').value, dd = d ? d.slice(2,4)+d.slice(5,7)+d.slice(8,10) : 'YYMMDD';
  return `${dd}_${slug($('#fn-proj').value)||'Projekt'}_${slug($('#fn-inh').value)||'Inhalt'}_${$('#fn-ver').value}.${$('#fn-ext').value}`;
}
function renderFname(){
  if(!$('#fn-out')) return;
  $('#fn-out').textContent = fileName();
  $('#fn-hint').textContent = ($('#fn-ver').value === 'final' && $('#fn-ext').value !== 'pdf') ? 'Finale Dokumente als PDF ablegen.' : '';
}
function initFname(){ $('#fn-date').value = new Date().toISOString().slice(0,10); renderFname(); }
function copyName(){
  const done = m => { const el = $('#fn-toast'); el.textContent = m; setTimeout(() => { if(el.textContent===m) el.textContent=''; }, 2600); };
  const fail = () => { const r=document.createRange(); r.selectNodeContents($('#fn-out')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); done('Markiert. Mit Ctrl+C kopieren.'); };
  try{ navigator.clipboard.writeText(fileName()).then(() => done('Kopiert.'), fail); }catch(e){ fail(); }
}

go((location.hash||'').slice(1) || 'start', 'replace');
</script>
